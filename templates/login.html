{% extends "base.html" %}

{% block content %}

<div class="auth-page auth-login-page">

    <div class="auth-glow glow-one"></div>
    <div class="auth-glow glow-two"></div>
    <div class="auth-glow glow-three"></div>

    <div class="auth-particle particle-one"></div>
    <div class="auth-particle particle-two"></div>
    <div class="auth-particle particle-three"></div>


    <div class="auth-login-shell">

        <div class="login-heading">

            <div class="auth-kicker">
                LOST &amp; FOUND
            </div>

            <h1>
                Welcome
                <span>Back</span>
            </h1>

            <p>
                Login to continue to your smart matching account.
            </p>

        </div>


        <div class="login-card">

            <div class="card-line"></div>


            <div class="login-brand-row">

                <div class="login-brand-icon">
                    ⌕
                </div>

                <div>

                    <div class="login-brand-title">
                        Smart Matching
                    </div>

                    <div class="login-brand-subtitle">
                        SECURE ACCOUNT ACCESS
                    </div>

                </div>

            </div>


            <form
                method="post"
                class="auth-form"
                id="loginForm"
                onsubmit="handleLoginSubmit(event)"
            >

                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show or hide password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-submit login-submit"
                    id="loginButton"
                >

                    <span id="loginButtonText">
                        Login
                    </span>

                </button>


                <div class="auth-helper">

                    <span></span>

                    Secure access to your account

                    <span></span>

                </div>

            </form>


            <div class="auth-bottom">

                <span>
                    Don't have an account?
                </span>

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            </div>

        </div>

    </div>

</div>


<script>

function togglePassword() {

    const input =
        document.getElementById("password");

    const button =
        document.querySelector(".password-toggle");

    if (!input || !button) {
        return;
    }


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        input.type = "password";

        button.textContent = "👁";

        button.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


/* =========================================================
   LOGIN SUBMIT LOADING EFFECT
========================================================= */

function handleLoginSubmit(event) {

    const form =
        document.getElementById("loginForm");

    const button =
        document.getElementById("loginButton");

    const buttonText =
        document.getElementById("loginButtonText");


    if (
        !form ||
        !button ||
        !buttonText
    ) {
        return;
    }


    /*
        Prevent accidental double submission.
    */

    if (
        button.dataset.submitting === "true"
    ) {

        event.preventDefault();

        return;

    }


    /*
        Mark button as submitting.
    */

    button.dataset.submitting = "true";

    button.disabled = true;


    /*
        Change button text.
    */

    buttonText.textContent =
        "Logging in...";


    /*
        Add loading animation.
    */

    button.classList.add(
        "login-loading"
    );

}

</script>


<style>

/* =========================================================
   LOGIN LOADING
========================================================= */

.login-submit.login-loading {

    position: relative;

    cursor: wait;

    opacity: 0.92;

}


.login-submit.login-loading::after {

    content: "";

    width: 8px;

    height: 8px;

    margin-left: 10px;

    border-radius: 50%;

    display: inline-block;

    background: white;

    animation:
        loginDotPulse
        0.8s
        infinite
        ease-in-out;

}


@keyframes loginDotPulse {

    0% {

        opacity: 0.35;

        transform:
            scale(0.7);

    }

    50% {

        opacity: 1;

        transform:
            scale(1.2);

    }

    100% {

        opacity: 0.35;

        transform:
            scale(0.7);

    }

}


/* =========================================================
   INPUT FOCUS
========================================================= */

.auth-input-wrap input:focus {

    outline: none;

}


.auth-input-wrap:focus-within {

    transform:
        translateY(-1px);

}


/* =========================================================
   PASSWORD BUTTON
========================================================= */

.password-toggle {

    cursor: pointer;

    border: none;

    background: transparent;

}


.password-toggle:focus {

    outline: none;

}

</style>

{% endblock %}
